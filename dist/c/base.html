*,*::before,*::after{box-sizing:border-box;margin:0}
body{font-family:'Noto Sans JP',system-ui,sans-serif;background:var(--bg);color:var(--fg);line-height:1.8;max-width:760px;margin:0 auto;padding:1.5rem 16px 4rem}

.step .no{display:inline-block;background:var(--accent);color:#fff;font-size:.75rem;font-weight:700;border-radius:3px;padding:0 .45rem;margin-right:.4rem}

td.mono{white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.6rem;margin-bottom:1rem}

<h1>基本量の単位と公式</h1>
<p class="lead">SIの7つの基本単位と、角度などの無次元量。すべての単位はここから組み立てられる。</p>
<h2>物理量</h2><div class="grid"><a href="/q/length.html">長さ<div class="u">m</div></a><a href="/q/mass.html">質量<div class="u">kg</div></a><a href="/q/time.html">時間<div class="u">s</div></a><a href="/q/current.html">電流<div class="u">A</div></a><a href="/q/temperature.html">温度（熱力学温度）<div class="u">K</div></a><a href="/q/amount.html">物質量<div class="u">mol</div></a><a href="/q/luminous_intensity.html">光度<div class="u">cd</div></a><a href="/q/angle.html">角度（平面角）<div class="u">rad</div></a><a href="/q/solid_angle.html">立体角<div class="u">sr</div></a><a href="/q/number.html">個数・無次元数<div class="u">1（無次元）</div></a></div>
<h2>公式</h2><ul><li><a href="/f/angle_arc.html">弧度法（ラジアン）の定義</a>：<span class="mono">θ = l / r</span></li><li><a href="/f/solid_angle_def.html">立体角（ステラジアン）の定義</a>：<span class="mono">Ω = S / r²</span></li></ul>
<footer>ブツリ単位ラボ — SI単位と次元解析で物理を理解する。<br>単位はすべてSI（国際単位系）で表記しています。</footer>
